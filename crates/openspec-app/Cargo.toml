[package]
name = "openspec-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
openspec-core = { path = "../openspec-core" }
# Low-level platform config-dir resolution. `dirs::config_dir()` is exactly the
# base Tauri v2's `app_config_dir()` joins the identifier onto, so the shell and
# the terminal frontend resolve the identical path. (Not `directories`, whose
# qualifier.org.app scheme diverges from the identifier path on Linux.)
dirs = "5"
# Opt-in Claude usage-quota poller (`crate::quota`): a blocking HTTPS client and
# RFC-3339 parsing for window reset times. `ureq` (rustls) is small and blocking,
# so it fits the std::thread poller without dragging an async HTTP stack in.
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

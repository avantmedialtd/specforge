[package]
name = "openspec-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
openspec-core = { path = "../openspec-core" }
# Low-level platform config-dir resolution. `dirs::config_dir()` is exactly the
# base Tauri v2's `app_config_dir()` joins the identifier onto, so the shell and
# the terminal frontend resolve the identical path. (Not `directories`, whose
# qualifier.org.app scheme diverges from the identifier path on Linux.)
#
# Held at the same major as `tauri`'s own `dirs` edge so that "identical path"
# is a property of the dependency graph — one crate, one implementation —
# rather than two majors that happen to agree. Tauri 2.11 resolves `dirs` 6;
# pinning 5 here reintroduces the coincidence.
dirs = "6"
# Opt-in usage-quota pollers (`crate::quota`, `crate::chatgpt_quota`): a blocking
# HTTPS client and RFC-3339 parsing for window reset times. `ureq` (rustls) is
# small and blocking, so it fits the std::thread poller without dragging an async
# HTTP stack in.
#
# No feature list: ureq 3's defaults are ["rustls", "gzip"] — rustls-on-ring with
# webpki-roots, the same backend and trust anchors ureq 2's ["tls", "gzip"] gave,
# so release.yml's zig cross-build note about ring still holds.
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Single-decode of a markdown link href before it's resolved against the
# authorized root (`AppService::open_artifact_link`). Already resolved in
# Cargo.lock (a transitive dep of `url`/`wry`), so this adds no new download —
# just a direct edge to a small, well-tested decoder instead of hand-rolling
# percent-decoding's UTF-8-boundary edge cases.
percent-encoding = "2"
# The BitBucket pull-request poller (`crate::bitbucket`) authenticates with an
# HTTP Basic credential, `base64(username:token)`, built in `usage_http::Auth`.
# Already resolved in Cargo.lock as `ureq`'s own edge; the version and feature
# set match that edge exactly (no `simd-unsafe` default), so this adds no new
# download and turns on no new feature — just a direct edge instead of
# hand-rolling an encoder for a credential.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# The pull-request viewer's review keys (`crate::review_progress`): a file with
# patch text is keyed by the SHA-256 of its bytes as received, never by a short
# or non-cryptographic hash, since the author controls the patch and the keys
# persist across runs and toolchains. Already resolved in Cargo.lock at 0.10.9,
# an edge of `wry`, `tauri-codegen` and `termwiz`, so this adds no new download.
sha2 = "0.10"
# The review-progress store's atomic writes (NamedTempFile + persist), as
# `openspec-core`'s registry writes its file. Already resolved in Cargo.lock as
# that crate's edge, so this adds no new download; the tests use it too, so it
# lives here rather than in [dev-dependencies].
tempfile = "3"
# The review skip patterns (`crate::review_skip`): globs that behave like
# `.gitignore`'s, compiled with `literal_separator` so `*` never crosses a `/`.
# The one new download of the change: nothing in the workspace matched globs
# before. Its `log` default is already in this crate's graph (ureq, notify).
globset = "0.4.20"
# The skip patterns' `/…/` form: a regular expression in the `regex` crate's own
# syntax, searched in the path, with linear-time matching and a bounded compile.
# Already resolved in Cargo.lock at 1.13 with its default features (the tauri
# crates' edge), so this adds no new download and turns on no new feature.
regex = "1.13"

[dev-dependencies]
serde_json = "1"

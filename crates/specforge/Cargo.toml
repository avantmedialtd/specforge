[package]
name = "specforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "specforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
openspec-core = { path = "../openspec-core" }
# SVG rasterization for the tray icon. Default features (text, system-fonts,
# raster-images) are disabled — the tray SVG is a pure shape with no text or
# embedded images, and dropping the font stack avoids ~MB of binary growth.
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }

# macOS-only: NSVisualEffectView sidebar vibrancy + native titlebar
# integration. Pulled in by lib.rs under `#[cfg(target_os = "macos")]`,
# so Windows/Linux builds are unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

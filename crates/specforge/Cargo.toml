[package]
name = "specforge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "specforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
# Opens the OS default handler for a validated artifact link (open_artifact_link
# command). Rust-only: no `@tauri-apps/plugin-opener` JS package, no `opener:*`
# permission in capabilities/default.json — the plugin's invoke surface stays
# closed and the only frontend-reachable operation is the validated command.
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
openspec-core = { path = "../openspec-core" }
openspec-app = { path = "../openspec-app" }
# The optional embedded web UI: when enabled in settings, the shell serves the
# browser skin from the same AppService it already holds (one watcher, no second
# writer). Loopback-only.
specforge-web = { path = "../specforge-web" }
# SVG rasterization for the tray icon. Default features (text, system-fonts,
# raster-images) are disabled — the tray SVG is a pure shape with no text or
# embedded images, and dropping the font stack avoids ~MB of binary growth.
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

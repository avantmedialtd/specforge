<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SpecForge</title>

        <!--
          The first-paint stamp (theme-system: *The Appearance Is In Effect On
          the First Paint*; design D14). A non-module inline script, so the parser
          runs it before it reaches the stylesheet link and the module script
          the build appends to the end of this head: the stylesheet never
          applies to an unstamped root, so no frame is painted in the Forge
          fallback ahead of the stored theme. `src/main.tsx` stamps again when
          the bundle runs, with the same values; that call is what seeds the
          appearance store and the theme-color meta, and the stamp is corrected
          from there. It cannot be the first stamp: a module script runs only
          after the stylesheet has loaded and a frame could have been painted.

          This is `readMirroredAppearance`, `resolveScheme` and the stamp of
          `applyAppearance` from `src/appearance.ts`, written out by hand
          because nothing is bundled yet when it runs. The storage key, the
          theme and scheme ids, the default pair and the media query are
          copies; `src/firstPaintStamp.test.ts` runs this script against those
          functions, so the copies cannot drift. It never throws: an absent,
          unreadable or unparseable mirror is the default pair, as it is there,
          and if anything else fails the root stays unstamped and base.css's
          Forge fallback follows the operating system's scheme.
        -->
        <script>
            (function () {
                var themes = ["forge", "blueprint", "folio", "mycelium"];
                var schemes = ["system", "light", "dark"];
                var theme = "forge";
                var scheme = "system";
                try {
                    var stored = JSON.parse(window.localStorage.getItem("specforge:appearance"));
                    if (typeof stored === "object" && stored !== null) {
                        if (themes.indexOf(stored.theme) >= 0) theme = stored.theme;
                        if (schemes.indexOf(stored.scheme) >= 0) scheme = stored.scheme;
                    }
                } catch (e) {}
                try {
                    var dark = false;
                    try {
                        dark = window.matchMedia("(prefers-color-scheme: dark)").matches === true;
                    } catch (e) {}
                    var resolved = scheme === "system" ? (dark ? "dark" : "light") : scheme;
                    var root = document.documentElement;
                    root.setAttribute("data-theme", theme);
                    root.setAttribute("data-scheme", resolved);
                    root.style.colorScheme = resolved;
                } catch (e) {}
            })();
        </script>

        <!--
          Icon set and install surface. The paths are deliberately root-absolute
          and unhashed: a browser probes /favicon.ico on its own without ever
          consulting the bundle graph, so these files are copied verbatim from
          public/ rather than imported as Vite assets.

          Small sizes use the authored anvil glyph and large sizes the forge
          illustration — below about 32px the illustration is not legible.

          Inert in the desktop shell, which loads this same document but has no
          tab strip and no install affordance.
        -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- The browser's own chrome colour. `src/appearance.ts` sets it from the
             active theme's `--bg` in the resolved scheme every time the
             appearance is stamped, from the moment the bundle first runs
             (theme-system: *The browser chrome colour follows the theme*). The
             first-paint stamp above leaves it alone: it runs before the
             stylesheet exists, so it has no `--bg` to read and would need a
             copy of every palette's background. The value here is what the
             chrome shows until the bundle runs, and what a page whose script
             never ran keeps — Forge's dark background, as in
             public/manifest.webmanifest. -->
        <meta name="theme-color" content="#141312" />

        <!-- Home-screen installation on iOS. `black` keeps the status bar dark
             with the content below it; `black-translucent` would push content
             under the bar and require safe-area insets the layout does not use. -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="SpecForge" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>

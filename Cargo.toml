[workspace]
resolver = "2"
members = [
    "crates/openspec-core",
    "crates/openspec-app",
    "crates/specforge",
    "crates/specforge-tui",
    "crates/specforge-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avantmedia/specforge"

[workspace.dependencies]
# 1.0.184 is the floor, not decoration: it introduced `rename_all_fields`, which
# `WorkspaceView` depends on to emit `displayName`. Under a plain "1" a
# minimal-version or unlocked resolution picks something older and the whole
# workspace dies on an "unknown serde container attribute" proc-macro error that
# names neither the version nor the remedy.
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# Clippy beyond its defaults, inherited by every crate through `[lints]
# workspace = true`. Each lint here catches a mistake rather than a style, and
# was trialled against the whole workspace first: the bulk of `pedantic` and
# `restriction` (unwrap_used, indexing_slicing, the cast_* family, string_slice,
# let_underscore_*) found only guarded or deliberate code, so they stay off.
# `warn` rather than `deny`: CI runs clippy with `-D warnings`, which makes
# every one of these an error there without breaking a local build mid-edit.
[workspace.lints.clippy]
# Left behind after debugging, or a panic waiting for the first caller.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# An `#[allow]` that outlives its reason stays silent forever. `#[expect]`
# fails once nothing trips the lint, and the reason says why it was needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# A lock guard in a `match`/`if let` scrutinee lives to the end of the whole
# block, holding the lock across everything the arms do.
significant_drop_in_scrutinee = "warn"

# A wildcard standing for exactly one variant silently swallows the next one
# added (see `crates/CLAUDE.md` on wildcard arms over `CacheEvent`).
match_wildcard_for_single_variants = "warn"

# `.ends_with(".png")` misses `.PNG`.
case_sensitive_file_extension_comparisons = "warn"

# Reading a binding whose leading underscore says it is unused.
used_underscore_binding = "warn"

# Quiet today; each names a bug with no false-positive story.
float_cmp = "warn"
invalid_upcast_comparisons = "warn"
unchecked_time_subtraction = "warn"
same_functions_in_if_condition = "warn"
should_panic_without_expect = "warn"
ignore_without_reason = "warn"
path_buf_push_overwrite = "warn"
debug_assert_with_mut_call = "warn"
read_zero_byte_vec = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Used only by cargo-mutants (`profile = "mutants"` in `.cargo/mutants.toml`).
# Inert for every other command — a custom profile applies only when named, so
# `cargo build`, `cargo test`, `cargo clippy` and `bun tauri build` are
# unaffected.
#
# `inherits = "test"` keeps `debug-assertions` and `overflow-checks` on, so a
# mutant that triggers an arithmetic overflow is still caught. It does NOT
# inherit `[profile.release]`'s `panic = "abort"` (release-only), so
# `#[should_panic]` and `catch_unwind` keep working under mutation — a mutant
# that aborted the process would be reported as a crash rather than as caught.
#
# `debug = "none"` is the point of the profile: openspec-core relinks eleven
# test binaries for every mutant, and DWARF generation dominates that link.
# Nothing reads a backtrace from a mutant run.
[profile.mutants]
inherits = "test"
debug = "none"

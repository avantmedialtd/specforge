[workspace]
resolver = "2"
members = [
    "crates/openspec-core",
    "crates/openspec-app",
    "crates/specforge",
    "crates/specforge-tui",
    "crates/specforge-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avantmedia/specforge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

name: Release

on:
  push:
    tags:
      - 'v*'

# Serialize back-to-back tag pushes: the second tag queues behind the first
# rather than racing. cancel-in-progress is false because we want both
# releases to publish, not just the latest one.
concurrency:
  group: release
  cancel-in-progress: false

# The release job creates a GitHub Release and uploads bundle assets.
permissions:
  contents: write

jobs:
  # The marketing site advertises one specific release: `site/src/site-config.ts`
  # holds the version and every download URL on the page is built from it.
  # `/release` writes that constant into the release commit, so a forgotten bump
  # would leave the published site linking the previous release's assets — and
  # nothing else in the pipeline would notice.
  #
  # This runs before the platform builds, so the mistake costs seconds rather
  # than the twenty minutes a full build takes.
  check-site-version:
    name: Check the site advertises this release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert the site version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          actual="$(grep -oE "RELEASE_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" site/src/site-config.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$actual" ]; then
            echo "::error::Could not read RELEASE_VERSION from site/src/site-config.ts"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::The site advertises $actual but this release is $expected."
            echo "::error::/release step 8 writes site/src/site-config.ts; fix the constant and re-tag."
            exit 1
          fi
          echo "The site advertises $actual, matching tag $TAG."

  build-linux:
    name: Build Linux bundles
    needs: check-site-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp version from tag
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ github.ref_name }}

      # The musl targets are for the headless `specforge-serve` binary only.
      # The GUI bundles keep the host's native gnu target — they link webkit and
      # GTK and cannot be static.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Tauri build (.deb, .AppImage)
        run: bun tauri build

      # Ship the terminal frontend as a standalone download. It's a plain
      # binary (no webview), so a direct cargo build is all it needs — and the
      # shared openspec-app/openspec-core graph is already compiled by the
      # Tauri build above, so this is mostly just the specforge-tui crate.
      - name: Build TUI binary
        run: cargo build --release -p specforge-tui

      # tar (not a raw binary) so the executable bit survives download/extract.
      - name: Package TUI archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "specforge-tui_${VERSION}_linux-x64.tar.gz" \
            -C target/release specforge-tui

      # Ship the standalone headless web server too — but unlike the TUI above,
      # not as a plain host build. A binary linked against this runner's glibc
      # will not start on distributions older than the runner image, which is
      # most long-term-support ones, so the headless binary is built for musl
      # and statically linked. One static binary then runs everywhere: Alpine
      # and other musl distributions, current glibc distributions, and older
      # ones alike. Only the headless binary changes; the .deb and .AppImage
      # above link webkit and GTK and stay dynamically linked.
      - name: Verify frontend bundle is present
        run: |
          test -f dist/index.html || {
            echo "dist/index.html missing — frontend bundle is empty or absent"
            exit 1
          }

      # zig is the C cross-compiler, not a convenience: `ring` (reached through
      # rustls) compiles C and assembly, so a pure-Rust linker cannot produce
      # these targets. It also covers aarch64-musl, for which apt has no cross
      # toolchain. The version is pinned to the combination verified locally.
      # Pinned to an immutable commit SHA, not a mutable `@v2` tag. This action
      # provisions the compiler that produces a binary we publish to npm and
      # attach to the release, so a tag repointed by a compromised upstream
      # would land inside a shipped artifact. Update deliberately, by resolving
      # a new tag to its SHA.
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build specforge-serve binaries (musl, x64 and arm64)
        run: |
          cargo zigbuild --release -p specforge-web --bin specforge-serve \
            --target x86_64-unknown-linux-musl
          cargo zigbuild --release -p specforge-web --bin specforge-serve \
            --target aarch64-unknown-linux-musl

      # A regression to dynamic linking would still produce a binary that works
      # on this runner and fails only on a user's older distribution — exactly
      # the defect this switch exists to fix. Assert it here rather than
      # rediscovering it in a bug report.
      - name: Verify serve binaries are statically linked
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="target/${target}/release/specforge-serve"
            info=$(file -b "$bin")
            echo "${target}: ${info}"
            echo "$info" | grep -q "statically linked" || {
              echo "::error::${bin} is not statically linked"
              exit 1
            }
          done

      - name: Package specforge-serve archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "specforge-serve_${VERSION}_linux-x64.tar.gz" \
            -C target/x86_64-unknown-linux-musl/release specforge-serve
          tar -czf "specforge-serve_${VERSION}_linux-arm64.tar.gz" \
            -C target/aarch64-unknown-linux-musl/release specforge-serve

      # Raw binaries for the npm channel, kept separate from the release
      # archives so the publish job never has to unpack a tarball to find them.
      # These are the same files the archives above contain.
      - name: Stage serve binaries for npm
        run: |
          set -euo pipefail
          mkdir -p npm-binaries/linux-x64 npm-binaries/linux-arm64
          cp target/x86_64-unknown-linux-musl/release/specforge-serve \
            npm-binaries/linux-x64/specforge-serve
          cp target/aarch64-unknown-linux-musl/release/specforge-serve \
            npm-binaries/linux-arm64/specforge-serve

      - name: Upload Linux npm binaries
        uses: actions/upload-artifact@v7
        with:
          name: npm-binaries-linux
          if-no-files-found: error
          path: npm-binaries/**

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            specforge-tui_*_linux-x64.tar.gz
            specforge-serve_*_linux-x64.tar.gz
            specforge-serve_*_linux-arm64.tar.gz

  build-windows:
    name: Build Windows bundles (cargo-xwin)
    needs: check-site-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp version from tag
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked

      # The xwin SDK is ~1 GB. Cache it across runs; bump the suffix to bust.
      - name: Cache xwin SDK
        uses: actions/cache@v6
        with:
          path: ~/.cache/xwin
          key: xwin-sdk-${{ runner.os }}-v1

      # Even though we're cross-compiling to Windows, tauri-cli runs on the
      # Linux host and does a host-side check for the appindicator library
      # (because the product uses a system tray). Mirror the Linux job's GUI
      # dev libs so that check passes.
      - name: Install Wine + NSIS + LLVM + host-side GUI libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine nsis clang llvm lld \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Tauri build (NSIS .exe)
        run: bun tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc

      # `tauri build` ran `cargo build --release` first, so the raw application
      # binary already exists next to the bundle/ dir — we just copy it to a
      # versioned, clearly-labelled name to ship a single-file portable build
      # (no installer) alongside the NSIS setup .exe. The crate package is
      # `specforge`, so the cross-compile output is lowercase `specforge.exe`.
      # NB: the portable exe is NOT bundled with WebView2 — it uses the system
      # runtime (preinstalled on Win11 / maintained Win10). The release notes
      # document that; the installer is the alternative for machines lacking it.
      - name: Stage portable executable
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/x86_64-pc-windows-msvc/release/specforge.exe" \
             "target/x86_64-pc-windows-msvc/release/SpecForge_${VERSION}_x64-portable.exe"

      # Cross-compile the TUI from the same xwin toolchain this job already set
      # up. `cargo xwin build` is the direct subcommand (the Tauri step above
      # uses cargo-xwin only as a --runner); both rely on the same installed
      # cargo-xwin + clang/lld + windows-msvc target.
      - name: Build TUI binary
        run: cargo xwin build --release -p specforge-tui --target x86_64-pc-windows-msvc

      # A Windows .exe needs no executable bit, but we still zip it for a
      # consistent "download an archive, extract, run" story across platforms.
      - name: Package TUI archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -j "specforge-tui_${VERSION}_windows-x64.zip" \
            target/x86_64-pc-windows-msvc/release/specforge-tui.exe

      # Ship the standalone headless web server too, cross-compiled from the
      # same xwin toolchain this job already set up for the TUI above.
      - name: Verify frontend bundle is present
        run: |
          test -f dist/index.html || {
            echo "dist/index.html missing — frontend bundle is empty or absent"
            exit 1
          }

      - name: Build specforge-serve binary
        run: cargo xwin build --release -p specforge-web --bin specforge-serve --target x86_64-pc-windows-msvc

      - name: Package specforge-serve archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -j "specforge-serve_${VERSION}_windows-x64.zip" \
            target/x86_64-pc-windows-msvc/release/specforge-serve.exe

      # Raw binary for the npm channel — the same file the zip above contains.
      - name: Stage serve binary for npm
        run: |
          set -euo pipefail
          mkdir -p npm-binaries/win32-x64
          cp target/x86_64-pc-windows-msvc/release/specforge-serve.exe \
            npm-binaries/win32-x64/specforge-serve.exe

      - name: Upload Windows npm binaries
        uses: actions/upload-artifact@v7
        with:
          name: npm-binaries-windows
          if-no-files-found: error
          path: npm-binaries/**

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundles
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/SpecForge_*_x64-portable.exe
            specforge-tui_*_windows-x64.zip
            specforge-serve_*_windows-x64.zip

  build-macos:
    name: Build macOS universal bundle
    needs: check-site-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp version from tag
        uses: ./.github/actions/stamp-version
        with:
          tag: ${{ github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Tauri build (universal-apple-darwin)
        run: bun tauri build --target universal-apple-darwin

      - name: Verify universal binary contains both arches
        run: |
          set -euo pipefail
          BIN=target/universal-apple-darwin/release/bundle/macos/SpecForge.app/Contents/MacOS/SpecForge
          info=$(lipo -info "$BIN")
          echo "$info"
          echo "$info" | grep -q "x86_64" || { echo "missing x86_64 slice"; exit 1; }
          echo "$info" | grep -q "arm64"  || { echo "missing arm64 slice";  exit 1; }

      # The GUI ships universal, so the TUI should too. `tauri build
      # --target universal-apple-darwin` only lipo's the GUI binary, so build
      # both arches of the TUI explicitly and merge them ourselves. Both targets
      # are already installed (above) for the universal GUI build.
      - name: Build TUI binary (both arches)
        run: |
          cargo build --release -p specforge-tui --target x86_64-apple-darwin
          cargo build --release -p specforge-tui --target aarch64-apple-darwin

      - name: Lipo TUI universal binary
        run: |
          set -euo pipefail
          lipo -create -output specforge-tui \
            target/x86_64-apple-darwin/release/specforge-tui \
            target/aarch64-apple-darwin/release/specforge-tui
          info=$(lipo -info specforge-tui)
          echo "$info"
          echo "$info" | grep -q "x86_64" || { echo "missing x86_64 slice"; exit 1; }
          echo "$info" | grep -q "arm64"  || { echo "missing arm64 slice";  exit 1; }

      - name: Package TUI archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "specforge-tui_${VERSION}_macos-universal.tar.gz" specforge-tui

      # Ship the standalone headless web server too, universal like the GUI
      # and the TUI. Both darwin targets are already installed above.
      - name: Verify frontend bundle is present
        run: |
          test -f dist/index.html || {
            echo "dist/index.html missing — frontend bundle is empty or absent"
            exit 1
          }

      - name: Build specforge-serve binary (both arches)
        run: |
          cargo build --release -p specforge-web --bin specforge-serve --target x86_64-apple-darwin
          cargo build --release -p specforge-web --bin specforge-serve --target aarch64-apple-darwin

      - name: Lipo specforge-serve universal binary
        run: |
          set -euo pipefail
          lipo -create -output specforge-serve \
            target/x86_64-apple-darwin/release/specforge-serve \
            target/aarch64-apple-darwin/release/specforge-serve
          info=$(lipo -info specforge-serve)
          echo "$info"
          echo "$info" | grep -q "x86_64" || { echo "missing x86_64 slice"; exit 1; }
          echo "$info" | grep -q "arm64"  || { echo "missing arm64 slice";  exit 1; }

      - name: Package specforge-serve archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "specforge-serve_${VERSION}_macos-universal.tar.gz" specforge-serve

      # npm packages are per-architecture, so the channel takes the thin slices
      # the step above already built rather than the merged universal binary.
      # This costs no compilation — both slices exist on disk before `lipo` runs
      # — and it spares every macOS user downloading an architecture they cannot
      # execute. The release asset stays universal.
      - name: Stage serve binaries for npm
        run: |
          set -euo pipefail
          mkdir -p npm-binaries/darwin-x64 npm-binaries/darwin-arm64
          cp target/x86_64-apple-darwin/release/specforge-serve \
            npm-binaries/darwin-x64/specforge-serve
          cp target/aarch64-apple-darwin/release/specforge-serve \
            npm-binaries/darwin-arm64/specforge-serve

      - name: Upload macOS npm binaries
        uses: actions/upload-artifact@v7
        with:
          name: npm-binaries-macos
          if-no-files-found: error
          path: npm-binaries/**

      - name: Upload macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundles
          if-no-files-found: error
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            specforge-tui_*_macos-universal.tar.gz
            specforge-serve_*_macos-universal.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    steps:
      # The release body is read from releases/<tag>.md committed at the tagged
      # ref (see body_path below), so this job needs the repository checked out
      # — the build jobs only download artifacts and never checked out before.
      # A tag push leaves github.ref at refs/tags/<tag>, so the default checkout
      # lands on exactly the released commit and its notes file.
      - uses: actions/checkout@v7

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          pattern: '*-bundles'
          merge-multiple: true
          path: dist

      - name: List collected bundles
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # Proper, curated release notes are authored by the /release command
          # and committed to releases/<tag>.md (the file name carries the
          # leading `v`, so it matches github.ref_name exactly). The body is
          # that file verbatim — no static preamble and no GitHub auto-changelog
          # (generate_release_notes is off). The notes' Downloads footer is what
          # documents the per-platform installs and caveats (Windows WebView2,
          # macOS Gatekeeper). If the file is missing the publish step fails
          # loudly rather than shipping an empty body.
          body_path: releases/${{ github.ref_name }}.md
          # dist/ has nested subdirs (dist/deb/, dist/appimage/, dist/nsis/)
          # after `merge-multiple: true`, so the glob has to recurse.
          files: dist/**/*
          # A SemVer prerelease is exactly "version core followed by a hyphen",
          # and a final tag's core is digits and dots only. This is the same
          # test `distTagFor` in npm/packaging.mjs applies, so both channels
          # classify a tag identically — an RC is a prerelease on GitHub and
          # `next` on npm, or it is neither.
          #
          # `draft` is NOT independent of `prerelease` here. The action computes
          #   draft = prerelease === true ? input_draft === true : true
          # so a stable release is always created as a draft and published at
          # the end, while a prerelease with draft:false would be created LIVE
          # and have ~300MB of assets uploaded to an already-public release.
          # Marking prereleases as drafts keeps the upload-then-publish ordering
          # every stable release has had; the explicit publish step below is
          # then required, because the action's finalize path returns early when
          # draft was requested.
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          # Must be 'false' for a prerelease: the API rejects prerelease+latest
          # outright. Deleting this line is NOT a fix — an omitted make_latest
          # means the API default, which is true.
          make_latest: "${{ contains(github.ref_name, '-') && 'false' || 'true' }}"

      # Publish the draft created above. Only a prerelease reaches here as a
      # draft; a stable release was already published by the action. This runs
      # before publish-npm (which is gated on this job), so the registry is
      # never written against a release that is still a draft.
      - name: Publish the prerelease
        if: contains(github.ref_name, '-')
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  # Publish the headless server to npm, so `npx @avantmedia/specforge` is a
  # complete path to a running server with no download and no quarantine step.
  #
  # This job runs LAST, after the GitHub Release is published, and that ordering
  # is deliberate. An npm publish cannot be reliably retracted, so if anything is
  # going to fail it should fail before the registry is touched: a failed release
  # then costs nothing, whereas publishing first and failing the release would
  # burn a version number permanently. Within the job, ordering is enforced by
  # npm/publish.mjs — platform packages first, wrapper last.
  #
  # A transient registry failure is recovered by re-running this job from the
  # same run: its artifacts are still available, the tag is unchanged, and
  # already-published packages are skipped rather than retried.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      # Trusted publishing: the registry authenticates this workflow by its OIDC
      # identity, so there is no long-lived npm token in repository secrets, and
      # every package carries build provenance. Provenance attests where a
      # package was built — it is not code signing, and the binaries remain
      # unsigned like every other artifact this pipeline produces.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1. Node 22 bundles npm 10.9.8,
      # which never attempts the OIDC exchange at all — the publish would fail
      # with ENEEDAUTH even with every trusted publisher correctly configured,
      # and it would fail *after* the GitHub Release is already public.
      #
      # `registry-url` is deliberately NOT set. With no NODE_AUTH_TOKEN in the
      # environment, setup-node writes an `:_authToken=${NODE_AUTH_TOKEN}` line
      # into .npmrc that expands to an empty token. registry.npmjs.org is npm's
      # default anyway, so omitting it costs nothing and removes a whole class
      # of authentication failure from the most expensive place to fail.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Pin the CLI rather than trusting whatever the runner image ships; the
      # bundled version is an image detail that can regress. The printed
      # version is the log-visible proof that OIDC is even possible.
      - name: Use an npm with trusted-publishing support
        run: |
          npm install -g npm@^11.15.0
          npm --version

      # Raw per-platform binaries staged by the three build jobs. These are the
      # same files the release archives contain, so both channels ship identical
      # bytes and this job never compiles anything.
      - name: Download npm binaries
        uses: actions/download-artifact@v8
        with:
          pattern: npm-binaries-*
          merge-multiple: true
          path: npm-binaries

      - name: List collected binaries
        run: find npm-binaries -type f | sort

      - name: Build packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node npm/build-packages.mjs \
            --version "$VERSION" \
            --binaries npm-binaries \
            --out npm-dist

      - name: Publish packages
        run: node npm/publish.mjs --dist npm-dist

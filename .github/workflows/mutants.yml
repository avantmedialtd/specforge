name: Mutants

# Mutation testing, gated to the lines a push actually changed.
#
# Scope is `openspec-core` + `openspec-app` only (see `.cargo/mutants.toml`),
# which is why this workflow needs no bun, no `bun run build` and no Tauri
# system libraries: the Tauri/webkit dependency graph is never compiled. That
# also makes it a deliberately separate workflow from `ci.yml` — a job that can
# run for fifteen minutes must not inherit that pipeline's
# `cancel-in-progress: true`, which is correct for its two-minute jobs.
#
# This job GATES. There are no pull requests in this repo — work lands by
# fast-forwarding master onto a worktree branch — so nothing here is enforced
# by branch protection. It is enforced by the drain workflow, which watches CI
# before merging. A red Mutants job means a line you just wrote can be broken
# without any test noticing: add the assertion, or exclude the mutant in
# `.cargo/mutants.toml` with a written reason.

on:
  push:
  workflow_dispatch:
    inputs:
      base:
        description: "Diff base (any git rev). Default: merge-base with origin/master."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Feature branches: only the tip matters, so cancel superseded runs exactly
  # as ci.yml does. master: this repo fast-forwards several times an hour and
  # every master commit is a permanent record, so each SHA gets its own group
  # and runs proceed in parallel rather than cancelling one another.
  group: mutants-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  in-diff:
    name: Mutants (changed lines)
    runs-on: ubuntu-latest
    # A typical change is a few minutes. Per-mutant timeouts in
    # .cargo/mutants.toml are the first line of defence against a hung mutant;
    # this is the backstop against the 360-minute GitHub default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          # Needed for the merge-base with origin/master, and for the `before`
          # commit on a master push. The repo's .git is small enough that a
          # full clone beats getting depth heuristics wrong.
          fetch-depth: 0

      - name: Compute the diff to mutate
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin master

          zero=0000000000000000000000000000000000000000
          head_sha="$(git rev-parse HEAD)"

          if [ -n "${MANUAL_BASE}" ]; then
            base="$(git rev-parse "${MANUAL_BASE}")"
            echo "Base from workflow_dispatch input."
          elif [ "${GITHUB_REF_NAME}" = "master" ] \
               && [ -n "${BEFORE}" ] && [ "${BEFORE}" != "${zero}" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # Push to master. Work lands here by fast-forward, so before..HEAD
            # is exactly the batch that just landed. Those commits were
            # normally already gated on their branch push; the pathspec filter
            # below makes the re-check free whenever they touched no in-scope
            # Rust.
            base="${BEFORE}"
            echo "Base from push.before (fast-forward onto master)."
          else
            # Branch push, the first push of a branch, or a force-push whose
            # `before` no longer resolves. Merge-base gives three-dot
            # semantics: only what this branch added on top of its divergence
            # point, never a reverse diff of commits that landed on master
            # since.
            base="$(git merge-base origin/master HEAD || true)"
            echo "Base from merge-base with origin/master."
          fi

          if [ -z "${base}" ] || [ "${base}" = "${head_sha}" ]; then
            echo "No usable diff base (base='${base}'). Nothing to mutate."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Base: ${base}  $(git log -1 --format=%s "${base}")"
          echo "Head: ${head_sha}"

          # Restrict to the in-scope crates' sources. Most commits in this repo
          # are OpenSpec artefacts or frontend work, so this short-circuits the
          # whole job in well under a minute for the common case.
          git diff "${base}" "${head_sha}" -- \
            'crates/openspec-core/src/*.rs' \
            'crates/openspec-app/src/*.rs' \
            > "${RUNNER_TEMP}/mutants-in.diff"

          if [ ! -s "${RUNNER_TEMP}/mutants-in.diff" ]; then
            echo "No changes under crates/{openspec-core,openspec-app}/src. Nothing to mutate."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            git diff --stat "${base}" "${head_sha}" -- \
              'crates/openspec-core/src/*.rs' 'crates/openspec-app/src/*.rs'
          fi

      - name: Install Rust toolchain
        if: steps.diff.outputs.empty == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        if: steps.diff.outputs.empty == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          # Dedicated key: this workflow fills target/mutants/, while ci.yml's
          # three Rust jobs fill target/debug/. Sharing a key would evict one
          # or the other on every run.
          shared-key: mutants
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-mutants
        if: steps.diff.outputs.empty == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: cargo mutants (changed lines only)
        if: steps.diff.outputs.empty == 'false'
        run: |
          # Scoping, timeouts, profile and exclusions all come from
          # .cargo/mutants.toml — keep this command line minimal so that what
          # CI runs and what a developer runs stay identical.
          #
          # -j2: ubuntu-latest is 4 vCPU, and openspec-core's suite is itself
          # multi-threaded and spawns real git subprocesses and OS filesystem
          # watchers, so this is already oversubscribed. If the
          # timing-sensitive targets (tests/watcher.rs, tests/repo_monitor.rs)
          # start producing spurious verdicts, drop to -j1 before touching the
          # timeouts.
          #
          # --no-shuffle: reproducible ordering, so a re-run reads like the
          # first run.
          cargo mutants --no-shuffle -j2 --in-diff "${RUNNER_TEMP}/mutants-in.diff"

      - name: Summarise survivors
        if: failure() && steps.diff.outputs.empty == 'false'
        run: |
          {
            echo "### Surviving mutants"
            echo
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo
            echo "### Timed out"
            echo
            echo '```'
            cat mutants.out/timeout.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutants.out
        if: always() && steps.diff.outputs.empty == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: mutants-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
